name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./... -v
      - name: Register with Go Module Proxy
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Registering $VERSION with proxy.golang.org..."
          curl -sf "https://proxy.golang.org/github.com/cyphera-labs/cyphera-go/@v/${VERSION}.info" || true
          echo ""
          echo "Requesting pkg.go.dev indexing..."
          curl -sf "https://proxy.golang.org/github.com/cyphera-labs/cyphera-go/@v/${VERSION}.mod" || true
          echo ""
          echo "Done. Package will appear at:"
          echo "  https://pkg.go.dev/github.com/cyphera-labs/cyphera-go@${VERSION}"

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: cyphera-go-${{ github.ref_name }}-sbom.cyclonedx.json
          upload-artifact: false
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: cyphera-go-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: cyphera-go-*-sbom.*.json
